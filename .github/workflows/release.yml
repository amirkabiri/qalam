# Automatic releases on every push to main: Conventional Commits drive the
# semver bump; a release (tag + GitHub Release + CHANGELOG.md) is cut only
# when the new commits contain a feat/fix. When a release lands, the Pages
# deploy job is called directly below — a `release: published` trigger can't
# do this job because the release is authored with the built-in GITHUB_TOKEN
# and GitHub never fires downstream workflows for GITHUB_TOKEN events.
name: Release

on:
  push:
    branches: [main]

# Never cut two releases concurrently; queue instead of cancelling so a
# queued push still releases after the in-flight one.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write # tags + releases + the chore(release) commit
  issues: write # semantic-release failure/issue comments
  pages: write # needed by the chained deploy job
  id-token: write

jobs:
  release:
    name: Semantic release
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.published.outputs.published }}
      version: ${{ steps.published.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          # semantic-release needs the full history to diff since the last tag
          # and must be able to push the release commit back to main.
          fetch-depth: 0
          persist-credentials: true

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_AUTHOR_NAME: qalam-release-bot
          GIT_AUTHOR_EMAIL: qalam-release-bot@users.noreply.github.com
          GIT_COMMITTER_NAME: qalam-release-bot
          GIT_COMMITTER_EMAIL: qalam-release-bot@users.noreply.github.com
        run: pnpm exec semantic-release

      # semantic-release (CLI) doesn't expose "was a release published" as a
      # step output; detect it by whether a v* tag now points at origin/main
      # (the release commit is tagged, so this is exact, not heuristic).
      - id: published
        name: Detect published release
        run: |
          git fetch origin main --tags --force
          tag="$(git tag --points-at FETCH_HEAD | head -n1)"
          if [ -n "$tag" ]; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          fi

  # Deploy the released version to GitHub Pages (reuses deploy.yml's job).
  deploy:
    name: Deploy released version
    needs: release
    if: needs.release.outputs.published == 'true'
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
